name: wintest
on:
  push:
    branches: [wintest]

jobs:
  selftest:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo build --release --locked --features "selftest tauri/custom-protocol"
        working-directory: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyautogui==0.9.54 pillow
      - run: python scripts/wintest/probe.py src-tauri\target\release\clight.exe selftest scripts\wintest\probe.js
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: C:\out
