[package]
name = "clight"
version = "0.1.5"
description = "A C/C++ IDE that runs on very low-end machines"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ropey = { version = "1", default-features = false, features = ["simd"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
vte = "0.15.0"
unicode-width = "0.2.3"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[features]
selftest = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
portable-pty = "0.9"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.local]
inherits = "release"
lto = "thin"
codegen-units = 16
