<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clight</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>
        <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.2" /><circle cx="6" cy="19" r="2.2" /><circle cx="18" cy="7" r="2.2" /><path d="M6 7.2v9.6M18 9.2c0 4-6 3-12 6.5" /></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.9l.1-.1a1.7 1.7 0 0 0-1.2-2.8H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.9-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></symbol>
        <symbol id="i-tree" viewBox="0 0 24 24"><path d="M3 5h8M8 12h13M8 19h13M5 5v14h3M5 12h3" /></symbol>
        <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="m7 9 3 3-3 3M13 15h4" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16h.01" /></symbol>
        <symbol id="f-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>
        <symbol id="f-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /></symbol>
        <symbol id="f-text" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5M9 13h6M9 17h6" /></symbol>
        <symbol id="f-cmake" viewBox="0 0 24 24"><path d="M12 3 21.5 20.5h-19z" /><path d="M12 3v11l9.5 6.5M12 14l-9.5 6.5" /></symbol>
        <symbol id="f-c" viewBox="0 0 24 24"><path d="m12 2.5 8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z" /><path d="M14.8 9.6a3.6 3.6 0 1 0 0 4.8" /></symbol>
        <symbol id="f-cpp" viewBox="0 0 24 24"><path d="m12 2.5 8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z" /><path d="M12.4 9.6a3.3 3.3 0 1 0 0 4.8M15 12h3.4M16.7 10.3v3.4" /></symbol>
        <symbol id="f-h" viewBox="0 0 24 24"><path d="m12 2.5 8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z" /><path d="M9.3 8v8M14.7 8v8M9.3 12h5.4" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" /></symbol>
        <symbol id="i-hammer" viewBox="0 0 24 24"><path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9" /><path d="m18 15 4-4" /><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5" /></symbol>
        <symbol id="i-bug" viewBox="0 0 24 24"><path d="m8 2 1.88 1.88M14.12 3.88 16 2M9 7.13v-1a3 3 0 1 1 6 0v1" /><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6M12 20v-9" /><path d="M6.53 9C4.6 8.8 3 7.1 3 5M6 13H2M3 21c0-2.1 1.7-3.9 3.8-4M20.97 5c0 2.1-1.6 3.8-3.5 4M22 13h-4M17.2 17c2.1.1 3.8 1.9 3.8 4" /></symbol>
        <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" /></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" /></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-15 6.7L3 16" /><path d="M8 16H3v5" /></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></symbol>
        <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5" /><path d="M9 4v16" /></symbol>
        <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12" /></symbol>
        <symbol id="i-max" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="0.5" /></symbol>
        <symbol id="i-restore" viewBox="0 0 24 24"><rect x="5.5" y="8.5" width="10" height="10" rx="0.5" /><path d="M8.5 8.5v-3h10v10h-3" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-over" viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 15-4l1.5 3" /><path d="M21 6v6h-6" /><circle cx="12" cy="18" r="1.6" /></symbol>
        <symbol id="i-into" viewBox="0 0 24 24"><path d="M12 3v11M7 9.5l5 5 5-5" /><circle cx="12" cy="20" r="1.6" /></symbol>
        <symbol id="i-out" viewBox="0 0 24 24"><path d="M12 15V4M7 8.5l5-5 5 5" /><circle cx="12" cy="20" r="1.6" /></symbol>
        <symbol id="i-resume" viewBox="0 0 24 24"><path d="M5 5v14" /><polygon points="10 5 20 12 10 19 10 5" /></symbol>
        <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M4 12h12M11 7l5 5-5 5M20 5v14" /></symbol>
      </defs>
    </svg>

    <div id="shell">
      <header id="bar">
        <div id="bar-left">
          <span class="mark" data-tauri-drag-region></span>
          <button id="burger" class="iconbtn" title="Main menu" hidden><svg class="ic"><use href="#i-menu" /></svg></button>
          <nav id="menus" hidden></nav>
          <button id="proj-chip" class="barchip" title="Switch project" hidden></button>
          <button id="st-git" class="barchip" title="Branches"></button>
        </div>
        <div class="drag" data-tauri-drag-region></div>
        <div class="tools" id="run-tools" hidden>
          <button id="profile-btn" class="barchip" title="Build profile"><span id="profile-label"></span><svg class="ic"><use href="#i-chevron" /></svg></button>
          <button id="runconf" class="barchip" title="Run configuration"><span id="runconf-label"></span><svg class="ic"><use href="#i-chevron" /></svg></button>
          <button id="build" class="iconbtn" title="Build (Ctrl+F9)"><svg class="ic"><use href="#i-hammer" /></svg></button>
          <button id="run" title="Run (Shift+F10)"><svg class="ic fill"><use href="#i-play" /></svg>Run</button>
          <button id="debug" class="iconbtn" title="Debug (Shift+F9)"><svg class="ic"><use href="#i-bug" /></svg></button>
          <button id="stop" class="iconbtn" title="Stop (Ctrl+F2)" disabled hidden><svg class="ic fill"><use href="#i-stop" /></svg></button>
          <span class="sep"></span>
          <button id="quick" class="iconbtn" title="Search (Ctrl+P)"><svg class="ic"><use href="#i-search" /></svg></button>
          <button id="gear" class="iconbtn" title="Settings (Ctrl+Alt+S)"><svg class="ic"><use href="#i-gear" /></svg></button>
        </div>
        <button id="update" hidden></button>
        <div class="ctl">
          <button id="w-min" aria-label="Minimize" title="Minimize"><svg class="ic"><use href="#i-min" /></svg></button>
          <button id="w-max" aria-label="Maximize" title="Maximize"><svg class="ic"><use id="w-max-use" href="#i-max" /></svg></button>
          <button id="w-close" class="close" aria-label="Close" title="Close"><svg class="ic"><use href="#i-x" /></svg></button>
        </div>
      </header>

      <section id="home"></section>

      <div id="work" hidden>
        <nav id="rail">
          <button data-left="project" title="Project (Alt+1)"><svg class="ic"><use href="#f-folder" /></svg></button>
          <button data-left="structure" title="Structure (Alt+7)"><svg class="ic"><use href="#i-tree" /></svg></button>
          <button data-left="git" title="Commit (Alt+0)"><svg class="ic"><use href="#i-branch" /></svg></button>
          <span class="grow"></span>
          <button data-bottom="find" title="Find (Alt+3)"><svg class="ic"><use href="#i-search" /></svg></button>
          <button data-bottom="build" title="Build output (Alt+B)"><svg class="ic"><use href="#i-hammer" /></svg></button>
          <button data-bottom="run" title="Run output (Alt+4)"><svg class="ic"><use href="#i-play" /></svg></button>
          <button data-bottom="debug" title="Debug (Alt+5)"><svg class="ic"><use href="#i-bug" /></svg></button>
          <button data-bottom="terminal" title="Terminal (Alt+F12)"><svg class="ic"><use href="#i-terminal" /></svg></button>
          <button data-bottom="problems" title="Problems (Alt+6)"><svg class="ic"><use href="#i-alert" /></svg></button>
          <button id="rail-gear" title="Settings (Ctrl+Alt+S)"><svg class="ic"><use href="#i-gear" /></svg></button>
        </nav>

        <aside id="left" class="island">
          <div class="toolhead"><span id="left-title"></span><span class="grow"></span><span id="left-actions" class="headacts"></span></div>
          <div id="v-project" class="view" tabindex="0"></div>
          <div id="v-structure" class="view" hidden></div>
          <div id="v-git" class="view" hidden></div>
        </aside>
        <div class="vr" id="side-rz"></div>

        <main id="main">
          <div id="editor-island" class="island">
          <div id="tabs"></div>
          <div id="findbar" hidden>
            <input id="find-q" placeholder="Find" spellcheck="false" />
            <span class="small muted" id="find-n"></span>
            <button id="find-case" class="toggle" aria-pressed="false" title="Match case">Aa</button>
            <button id="find-prev" class="iconbtn" title="Previous (Shift+Enter)">↑</button>
            <button id="find-next" class="iconbtn" title="Next (Enter)">↓</button>
            <input id="find-r" placeholder="Replace" spellcheck="false" />
            <button id="find-one" class="plain">Replace</button>
            <button id="find-all" class="plain">All</button>
            <span class="grow"></span>
            <button id="find-x" class="iconbtn"><svg class="ic"><use href="#i-x" /></svg></button>
          </div>
          <div id="ed">
            <div id="empty"></div>
            <div id="scroll" hidden>
              <div id="sizer">
                <div id="gutter"><div id="gmarks"></div></div>
                <div id="text">
                  <div id="curline"></div>
                  <div id="margin"></div>
                  <div id="execline" hidden></div>
                  <div id="occ"></div>
                  <div id="marks"></div>
                  <div id="sel"></div>
                  <div id="pair"></div>
                  <div id="lines"></div>
                  <div id="diags"></div>
                  <div id="caret-trail"></div>
                  <div id="caret-glow"></div>
                  <div id="caret"></div>
                  <div id="drop-caret" hidden></div>
                  <div id="ghost" hidden></div>
                  <textarea id="ime" autocapitalize="off" autocomplete="off" spellcheck="false" wrap="off" aria-label="Editor"></textarea>
                </div>
              </div>
            </div>
            <div id="completion" hidden></div>
            <div id="hover" hidden></div>
            <div id="sig" hidden></div>
            <div id="stripes"></div>
          </div>
          </div>
          <div class="hr" id="panel-rz" hidden></div>
          <section id="panel" class="island" hidden>
            <div class="panelhead"><span id="panel-title"></span><span id="panel-sub" class="small muted"></span><span class="grow"></span><span id="panel-actions" class="headacts"></span><button id="panel-x" class="iconbtn" title="Hide"><svg class="ic"><use href="#i-x" /></svg></button></div>
            <div id="v-build" class="view out" tabindex="0" hidden></div>
            <div id="v-run" class="view runview" hidden><div class="tgrid grow" id="run-term" hidden></div><div class="out grow" id="run-out" tabindex="0"></div><input id="stdin" spellcheck="false" autocomplete="off" hidden /></div>
            <div id="v-debug" class="view" hidden></div>
            <div id="v-problems" class="view list-view" hidden></div>
            <div id="v-find" class="view list-view" hidden></div>
            <div id="v-terminal" class="view" hidden></div>
          </section>
        </main>
      </div>

      <footer id="status" hidden>
        <span id="st-path"></span>
        <span id="st-msg" class="grow"></span>
        <button id="st-diag" class="stbtn" title="Problems"></button>
        <button id="st-clangd" class="stbtn" title="Code intelligence"></button>
        <span id="st-pos"></span>
        <span id="st-eol" class="opt"></span>
        <span class="opt">UTF-8</span>
        <span id="st-indent" class="opt"></span>
      </footer>
    </div>

    <div id="modal-root"></div>
    <div id="menu" hidden></div>
    <div id="toast" hidden></div>
    <div id="glow" hidden></div>
    <div class="rz n" data-rz="North"></div><div class="rz s" data-rz="South"></div><div class="rz e" data-rz="East"></div><div class="rz w" data-rz="West"></div>
    <div class="rz ne" data-rz="NorthEast"></div><div class="rz nw" data-rz="NorthWest"></div><div class="rz se" data-rz="SouthEast"></div><div class="rz sw" data-rz="SouthWest"></div>
    <span id="measure" aria-hidden="true"></span>
    <script type="module" src="app.js"></script>
  </body>
</html>
